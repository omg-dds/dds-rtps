name: 2 - Upload Test Results to Drive
run-name: ${{ github.actor }} is uploading test results (${{ inputs.runner || 'ubuntu-latest' }}) 🚀
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

jobs:
  upload_artifact:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.RCLONE_TOKEN }}" ] || [ -z "${{ secrets.DRIVE_FOLDER_ID }}" ]; then
            echo "::error::Missing RCLONE_TOKEN or DRIVE_FOLDER_ID secrets. Cannot upload to Drive."
            exit 1
          fi

      - name: Get Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: interoperability_report_complete
          workflow: 1_run_interoperability_tests.yml
          workflow_conclusion: completed
          repo: ${{ github.repository }}

      - name: Ensure system dependencies
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y zip || echo "Warning: sudo apt-get install zip failed. Python fallback will be used."
            else
              echo "Warning: zip command not found and sudo is not available. Python fallback will be used."
            fi
          fi

      - name: Create files to upload
        run: |
          rm -rf report_* interoperability_report_*.zip
          if [ -f timestamp ]; then
            current_date=$(cat timestamp | tr -d '\r\n')
          elif ls timestamp*.timestamp 1>/dev/null 2>&1; then
            current_date=$(cat timestamp*.timestamp | head -n 1 | tr -d '\r\n')
          else
            current_date=$(date '+%Y-%m-%d-%H_%M_%S')
          fi
          echo "$current_date" > timestamp

          [ -f index.html ] && mv index.html interoperability_report.html

          for file in interoperability_report.html junit_interoperability_report.xml interoperability_report.xlsx timestamp; do
            if [ -f "$file" ]; then
              cp "$file" "${file%.*}_$current_date.${file##*.}"
            fi
          done

          # Also preserve any discovery reports if present in artifact
          for file in discovery_report*.json junit_discovery_report*.xml; do
            if [ -f "$file" ]; then
              if [[ "$file" != *"$current_date"* ]]; then
                cp "$file" "${file%.*}_$current_date.${file##*.}"
              fi
            fi
          done

          if command -v zip >/dev/null 2>&1; then
            zip interoperability_report_$current_date.zip *_$current_date.*
          else
            python3 -m zipfile -c interoperability_report_$current_date.zip *_$current_date.*
          fi

          mkdir -p report_$current_date
          mv interoperability_report_$current_date.zip report_$current_date/
          if [ -f interoperability_report_$current_date.xlsx ]; then
            cp interoperability_report_$current_date.xlsx report_$current_date/
          fi

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [mygdrive]
            type = drive
            token = ${{ secrets.RCLONE_TOKEN }}
          disable_base64: true

      - name: Upload reports to Google Drive
        run: |
          current_date=$(cat timestamp)
          rclone copy report_$current_date mygdrive:report_$current_date --drive-root-folder-id ${{ secrets.DRIVE_FOLDER_ID }} -v

      - name: Attach detailed report html
        uses: actions/upload-artifact@v4
        with:
          name: detailed_report
          path: |
            ./interoperability_report*.html
